const select=document.getElementById('scene'),modelsEl=document.getElementById('models'),propsEl=document.getElementById('props'),guide=document.getElementById('guide');let current=0,start=performance.now(),paused=false,pauseAt=0;

function interp(keys,t){if(!keys)return [50,-10,0];let a=keys[0],b=keys[keys.length-1];for(let i=0;i<keys.length-1;i++)if(t>=keys[i][0]&&t<=keys[i+1][0]){a=keys[i];b=keys[i+1];break}const q=b[0]===a[0]?0:(t-a[0])/(b[0]-a[0]);return[a[1]+(b[1]-a[1])*q,a[2]+(b[2]-a[2])*q,a[3]+(b[3]-a[3])*q]}
